name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 项目零依赖，没有 go.sum，关掉模块缓存避免无谓的告警
          cache: false

      - name: 检查格式
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -race ./...

  build:
    name: 交叉编译 (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 项目零依赖，没有 go.sum，关掉模块缓存避免无谓的告警
          cache: false

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /dev/null .
