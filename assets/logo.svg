<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="cf-ddns logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBAD41"/>
      <stop offset="1" stop-color="#F6821F"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Cloudflare 边缘节点 -->
  <g fill="url(#cloud)">
    <circle cx="64" cy="44" r="20"/>
    <circle cx="46" cy="54" r="14"/>
    <circle cx="84" cy="54" r="14"/>
    <rect x="46" y="54" width="38" height="14" rx="3"/>
  </g>

  <!-- 三条运营商线路 -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M64 66 C 64 84, 34 80, 34 92" stroke="#22C55E"/>
    <path d="M64 66 L 64 92" stroke="#F43F5E"/>
    <path d="M64 66 C 64 84, 94 80, 94 92" stroke="#38BDF8"/>
  </g>
  <circle cx="34" cy="101" r="7" fill="#22C55E"/>
  <circle cx="64" cy="101" r="7" fill="#F43F5E"/>
  <circle cx="94" cy="101" r="7" fill="#38BDF8"/>
</svg>
